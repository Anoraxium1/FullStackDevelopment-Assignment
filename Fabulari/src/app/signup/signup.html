<div class="logo-box">
  <span>LOGO</span>
</div>

<div class="card auth-card">
  <div class="card-body">
    <h1 class="auth-title">Signup</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email">
      </div>
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" [(ngModel)]="username">
      </div>
      <div class="mb-3 text-start">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" class="form-control" id="dob" name="dob" [(ngModel)]="dob">
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
      </div>
      <div class="d-flex justify-content-between gap-2 mt-4">
        <button type="submit" class="btn btn-outline-dark flex-fill">Submit &gt;</button>
        <button type="button" class="btn btn-outline-dark flex-fill" routerLink="/">Login</button>
      </div>
    </form>
  </div>
</div>
