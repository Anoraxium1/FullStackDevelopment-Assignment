<div class="chat-shell card chat-card">
  
  <button type="button" class="logout" routerLink="/">Logout</button>
  <button type="button" class="settings" routerLink="/settings">&#9776;</button>
  
  <div class="panel-title group-name-bar">Group Name</div>
  
  <div class="toggle-row">
    <button type="button" class="groups-toggle" (click)="toggleGroups()">
      {{ showGroups() ? '&lt;' : '&gt;' }}
    </button>
    <button type="button" class="description-toggle" (click)="toggleDescription()">
      {{ showDescription() ? '&gt;' : '&lt;' }}
    </button>
  </div>

   <div class="card-body">
    @if (showGroups()) {
      <aside class="groups-col">
        <div class="panel-title">Groups</div>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 1" (click)="selectGroup(1)">Group 1 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 2" (click)="selectGroup(2)">Group 2 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 3" (click)="selectGroup(3)">Group 3 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 4" (click)="selectGroup(4)">Group 4 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 5" (click)="selectGroup(5)">Group 5 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedGroup() === 6" (click)="selectGroup(6)">Group 6 Name</button>
        <button type="button" class="list-btn find-groups">Find Groups</button>
      </aside>

      <aside class="rooms-col">
        <div class="panel-title">Rooms</div>
        <button type="button" class="list-btn" [class.selected]="selectedRoom() === 1" (click)="selectRoom(1)">Room 1 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedRoom() === 2" (click)="selectRoom(2)">Room 2 Name</button>
        <button type="button" class="list-btn" [class.selected]="selectedRoom() === 3" (click)="selectRoom(3)">Room 3 Name</button>
      </aside>
    }

    <main class="messages-col">
      <div class="messages-list"></div>

      <form class="message-input-row">
        <input type="text" class="form-control" placeholder="Users Message">
        <button type="submit" class="btn btn-outline-dark">&gt;</button>
      </form>
    </main>

    @if (showDescription()) {
      <aside class="info-col">
        <button type="button" class="list-btn" [class.selected]="infoTab() === 'info'" (click)="setInfoTab('info')">Group Info</button>
        <button type="button" class="list-btn" [class.selected]="infoTab() === 'age'" (click)="setInfoTab('age')">Age Limit</button>
        <button type="button" class="list-btn" [class.selected]="infoTab() === 'colour'" (click)="setInfoTab('colour')">Colour Theme</button>

        <div class="info-box">Group Description</div>
      </aside>
    }
  </div>
</div>
