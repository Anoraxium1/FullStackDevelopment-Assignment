<div class="chat-shell chat-card">
   <div class="card-body">
    <aside class="groups-col">
      <div class="panel-title">Groups</div>
      <button type="button" class="list-btn selected">Group 1 Name</button>
      <button type="button" class="list-btn">Group 2 Name</button>
      <button type="button" class="list-btn">Group 3 Name</button>
      <button type="button" class="list-btn">Group 4 Name</button>
      <button type="button" class="list-btn">Group 5 Name</button>
      <button type="button" class="list-btn">Group 6 Name</button>
      <button type="button" class="list-btn find-groups">Find Groups</button>
    </aside>

    <aside class="rooms-col">
      <div class="panel-title">Rooms</div>
      <button type="button" class="list-btn selected">Room 1</button>
      <button type="button" class="list-btn">Room 2</button>
      <button type="button" class="list-btn">Room 3</button>
      <button type="button" class="list-btn">Room 4</button>
      <button type="button" class="list-btn">Room 5</button>
    </aside>

    <main class="messages-col">
      <div class="panel-title group-name-bar">
        Group Name
        <button type="button" class="hamburger">&#9776;</button>
      </div>

      <div class="messages-list"></div>

      <form class="message-input-row">
        <input type="text" class="form-control" placeholder="Users Message">
        <button type="submit" class="btn btn-outline-dark">&gt;</button>
      </form>
    </main>

    <aside class="info-col">
      <button type="button" class="list-btn">Group Info</button>
      <button type="button" class="list-btn">Age Limit</button>
      <button type="button" class="list-btn">Colour Theme</button>

      <div class="info-box">Group Description</div>
    </aside>
  </div>
</div>
