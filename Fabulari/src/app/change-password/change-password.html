<div class="card auth-card">
  <div class="card-body">
    <h1 class="auth-title">Change Password</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="currentPassword" class="form-label">Current Password</label>
        <input [type]="showPassword0() ? 'text' : 'password'" class="form-control" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword">
      </div>
      <div class="form-check text-start">
        <input type="checkbox" class="form-check-input" id="visbility-check-box" (change)="togglePasswordVisibility0()">
        <label class="form-check-label" for="visbility-check-box">Show password</label>
      </div>
      <div class="form-field">
        <label for="newPassword" class="form-label">New Password</label>
        <input [type]="showPassword1() ? 'text' : 'password'" class="form-control" id="newPassword" name="newPassword" [(ngModel)]="newPassword">
      </div>
      <div class="form-check text-start">
        <input type="checkbox" class="form-check-input" id="visbility-check-box" (change)="togglePasswordVisibility1()">
        <label class="form-check-label" for="visbility-check-box">Show password</label>
      </div>
      <div class="form-field">
        <label for="confirmPassword" class="form-label">Re-Type Password</label>
        <input [type]="showPassword2() ? 'text' : 'password'" class="form-control" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword">
      </div>
      <div class="form-check text-start">
        <input type="checkbox" class="form-check-input" id="visbility-check-box" (change)="togglePasswordVisibility2()">
        <label class="form-check-label" for="visbility-check-box">Show password</label>
      </div>
      <div class="button-row">
        <button type="button" class="btn btn-outline-dark">Submit</button>
        <button type="submit" class="btn btn-outline-dark" routerLink="/settings">&lt; Back</button>
      </div>
    </form>
  </div>
</div>
