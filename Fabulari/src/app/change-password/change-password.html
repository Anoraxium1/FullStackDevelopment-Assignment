<div class="card auth-card">
  <div class="card-body">
    <h1 class="auth-title">Change Password</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="currentPassword" class="form-label">Current Password</label>
        <input type="password" class="form-control" id="currentPassword" name="currentPassword" [(ngModel)]="currentPassword">
      </div>
      <div class="form-field">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
      </div>
      <div class="form-field">
        <label for="confirmPassword" class="form-label">Re-Type Password</label>
        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
      </div>
      <div class="button-row">
        <button type="button" class="btn btn-outline-dark">Submit</button>
        <button type="submit" class="btn btn-outline-dark" routerLink="/settings">&lt; Back</button>
      </div>
    </form>
  </div>
</div>
